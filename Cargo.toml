[package]
edition = "2024"
name = "rp2040-linker"
version = "0.2.1"
authors = ["Jorge Andre Castro <georgeandrec@gmail.com>"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Automatic linker and boot (BOOT2) configuration for RP2040 (Pico 1) in Rust. Pure no_std infrastructure."
documentation = "https://docs.rs/rp2040-linker"
readme = "README.md"
keywords = [
    "rp2040",
    "pico",
    "linker",
    "no_std",
    "embedded",
]
categories = [
    "embedded",
    "no-std",
    "development-tools",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jorgeandrecastro/rp2040-linker"

[features]
default = []

[lib]
name = "rp2040_linker"
path = "src/lib.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true